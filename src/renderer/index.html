<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zack Studio 3D Renderer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 1080px; height: 1920px; overflow: hidden; background: #080a10; font-family: 'Impact', 'Arial Black', sans-serif; }
    #canvas-container { width: 1080px; height: 1920px; position: absolute; top: 0; left: 0; z-index: 1; }

    /* Dynamic Overlay Captions Studio */
    #caption-overlay {
      position: absolute;
      top: 0; left: 0; width: 1080px; height: 1920px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 60px;
      text-align: center;
    }

    .caption-box {
      position: absolute;
      bottom: 480px;
      width: 90%;
      text-align: center;
      line-height: 1.15;
      text-transform: uppercase;
      font-size: 78px;
      letter-spacing: 2px;
      color: #FFFFFF;
      text-shadow:
        0px 0px 20px rgba(0,0,0,0.9),
        4px 4px 0px #000,
        -4px -4px 0px #000,
        4px -4px 0px #000,
        -4px 4px 0px #000;
      opacity: 0;
      transform: scale(0.85);
      transition: all 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .caption-box.active {
      opacity: 1;
      transform: scale(1.05);
    }

    .word-highlight {
      color: #FFEA00;
      display: inline-block;
      text-shadow:
        0px 0px 25px rgba(255, 234, 0, 0.8),
        4px 4px 0px #000,
        -4px -4px 0px #000;
    }

    .word-accent {
      color: #FF2A55;
      display: inline-block;
      text-shadow:
        0px 0px 25px rgba(255, 42, 85, 0.8),
        4px 4px 0px #000,
        -4px -4px 0px #000;
    }

    /* Cinematic Vignette */
    #vignette {
      position: absolute;
      top: 0; left: 0; width: 1080px; height: 1920px;
      z-index: 5;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.7) 85%, rgba(0, 0, 0, 0.98) 100%);
    }
  </style>
  <!-- Load Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="vignette"></div>
  <div id="caption-overlay">
    <div id="caption-text" class="caption-box"></div>
  </div>

  <script>
    // Zack D. Films Renderer Engine
    let scene, camera, renderer;
    let toothGroup, drillGroup, cavityMesh, nerveMesh, pulseParticleSystem;
    let sceneConfig = null;
    let isReady = false;

    function initEngine() {
      const container = document.getElementById('canvas-container');

      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060810);
      scene.fog = new THREE.FogExp2(0x060810, 0.035);

      // Camera (9:16 vertical view)
      camera = new THREE.PerspectiveCamera(45, 1080 / 1920, 0.1, 100);
      camera.position.set(0, 1.2, 7.5);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
      renderer.setSize(1080, 1920);
      renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.35;
      container.appendChild(renderer.domElement);

      // Studio Lighting System (Zack D. Films Signature Dynamic Rim Lighting)
      const ambientLight = new THREE.AmbientLight(0x1a2035, 1.8);
      scene.add(ambientLight);

      // Key Rim Light Top-Right (Dramatic Cyan rim)
      const rimLight1 = new THREE.DirectionalLight(0x00d2ff, 4.5);
      rimLight1.position.set(6, 8, -4);
      scene.add(rimLight1);

      // Key Accent Light Top-Left (Hot Pink rim)
      const rimLight2 = new THREE.DirectionalLight(0xff2a55, 3.8);
      rimLight2.position.set(-6, 6, 4);
      scene.add(rimLight2);

      // Front Main Spotlight
      const mainSpot = new THREE.SpotLight(0xffffff, 5.5, 20, Math.PI / 4, 0.5, 1);
      mainSpot.position.set(0, 5, 8);
      mainSpot.castShadow = true;
      mainSpot.shadow.mapSize.width = 2048;
      mainSpot.shadow.mapSize.height = 2048;
      mainSpot.shadow.bias = -0.0001;
      scene.add(mainSpot);

      // Bottom Fill Light
      const bottomFill = new THREE.PointLight(0x3366ff, 1.5, 10);
      bottomFill.position.set(0, -4, 3);
      scene.add(bottomFill);

      // Studio Floor Platform
      const floorGeo = new THREE.PlaneGeometry(30, 30);
      const floorMat = new THREE.MeshStandardMaterial({
        color: 0x0a0c16,
        roughness: 0.35,
        metalness: 0.85
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -2.8;
      floor.receiveShadow = true;
      scene.add(floor);

      buildAnatomicMolar();
      isReady = true;
    }

    function buildAnatomicMolar() {
      toothGroup = new THREE.Group();

      // ----------------------------------------------------
      // 1. ANATOMICALLY ACCURATE MOLAR CROWN (4 CUSPS + GROOVES)
      // ----------------------------------------------------
      const crownGeo = new THREE.BoxGeometry(2.1, 1.7, 1.8, 48, 48, 48);
      const posAttr = crownGeo.attributes.position;

      for (let i = 0; i < posAttr.count; i++) {
        let x = posAttr.getX(i);
        let y = posAttr.getY(i);
        let z = posAttr.getZ(i);

        // Normalized relative height
        const ny = (y + 0.85) / 1.7; // 0 (bottom/cervical) to 1 (top/occlusal surface)

        // Bulge at cervical neck / waist contour (real anatomical tooth bulge)
        let radiusFactor = 1.0;
        if (ny < 0.2) {
          // Narrow neck at cementoenamel junction
          radiusFactor = 0.7 + ny * 1.5;
        } else if (ny < 0.6) {
          // Equatorial height of contour
          radiusFactor = 1.0 + Math.sin((ny - 0.2) * Math.PI / 0.4) * 0.12;
        } else {
          // Taper towards occlusal surface
          radiusFactor = 1.12 - (ny - 0.6) * 0.3;
        }

        x *= radiusFactor;
        z *= radiusFactor;

        // Occlusal Surface Cusp Anatomy (Top surface modeling)
        if (ny > 0.65) {
          const occlusalP = (ny - 0.65) / 0.35;

          // 4 Main Cusps: Mesiobuccal, Distobuccal, Mesiolingual, Distolingual
          const cuspMB = Math.exp(-((x + 0.5)**2 + (z - 0.4)**2) * 2.8) * 0.38;
          const cuspDB = Math.exp(-((x - 0.5)**2 + (z - 0.4)**2) * 2.8) * 0.35;
          const cuspML = Math.exp(-((x + 0.5)**2 + (z + 0.4)**2) * 2.8) * 0.36;
          const cuspDL = Math.exp(-((x - 0.5)**2 + (z + 0.4)**2) * 2.8) * 0.32;

          // Central Fossa / Pit (depression in center)
          const centralFossa = -Math.exp(-(x**2 + z**2) * 3.5) * 0.30;

          // Developmental Grooves (Cross-shaped fissure pattern)
          const grooveX = -Math.exp(-(x**2) * 12.0) * 0.15;
          const grooveZ = -Math.exp(-(z**2) * 12.0) * 0.15;

          const anatomicalDisplacement = (cuspMB + cuspDB + cuspML + cuspDL + centralFossa + grooveX + grooveZ) * occlusalP;
          y += anatomicalDisplacement;
        }

        // Rounded natural corners
        const cornerDist = Math.sqrt(x*x + z*z);
        if (cornerDist > 0.8) {
          const smooth = 1.0 - (cornerDist - 0.8) * 0.18;
          x *= smooth;
          z *= smooth;
        }

        posAttr.setXYZ(i, x, y, z);
      }
      crownGeo.computeVertexNormals();

      // Enamel Material (High realistic polish, subtle translucency feel)
      const enamelMat = new THREE.MeshStandardMaterial({
        color: 0xfaf8f2,
        roughness: 0.15,
        metalness: 0.05,
        roughnessMap: null,
        clearcoat: 0.95,
        clearcoatRoughness: 0.08
      });

      const crownMesh = new THREE.Mesh(crownGeo, enamelMat);
      crownMesh.position.y = 0.5;
      crownMesh.castShadow = true;
      crownMesh.receiveShadow = true;
      toothGroup.add(crownMesh);

      // ----------------------------------------------------
      // 2. REALISTIC DUAL ROOT SYSTEM (MESIAL & DISTAL ROOTS)
      // ----------------------------------------------------
      function createAnatomicRoot(isMesial) {
        const rootGroup = new THREE.Group();
        const rootGeo = new THREE.CylinderGeometry(0.55, 0.12, 2.2, 32, 32);
        const rPos = rootGeo.attributes.position;

        for (let i = 0; i < rPos.count; i++) {
          let rx = rPos.getX(i);
          let ry = rPos.getY(i); // +1.1 to -1.1
          let rz = rPos.getZ(i);

          const progress = (1.1 - ry) / 2.2; // 0 at top neck, 1 at root tip

          // Flatten root cross section (roots are oval/flattened mesiodistally)
          rx *= 0.75;
          rz *= 1.15;

          // Natural anatomical root curve (mesial bends slightly distal near apex)
          const curveDirection = isMesial ? 0.25 : -0.20;
          rx += Math.pow(progress, 1.8) * curveDirection;

          // Tapering
          const scale = 1.0 - Math.pow(progress, 1.3) * 0.75;
          rx *= scale;
          rz *= scale;

          rPos.setXYZ(i, rx, ry, rz);
        }
        rootGeo.computeVertexNormals();

        const rootMat = new THREE.MeshStandardMaterial({
          color: 0xdfd4be,
          roughness: 0.45,
          metalness: 0.02
        });

        const rootMesh = new THREE.Mesh(rootGeo, rootMat);
        rootMesh.castShadow = true;
        rootMesh.receiveShadow = true;
        rootGroup.add(rootMesh);

        return rootGroup;
      }

      const mesialRoot = createAnatomicRoot(true);
      mesialRoot.position.set(-0.6, -1.3, 0);
      toothGroup.add(mesialRoot);

      const distalRoot = createAnatomicRoot(false);
      distalRoot.position.set(0.6, -1.3, 0);
      toothGroup.add(distalRoot);

      // ----------------------------------------------------
      // 3. CAVITY & INFECTED DENTIN CHAMBER
      // ----------------------------------------------------
      const cavityGeo = new THREE.SphereGeometry(0.48, 32, 32);
      const cavityMat = new THREE.MeshStandardMaterial({
        color: 0x1c0f08,
        roughness: 0.85,
        metalness: 0.05,
        emissive: 0x550d00,
        emissiveIntensity: 0.6
      });
      cavityMesh = new THREE.Mesh(cavityGeo, cavityMat);
      cavityMesh.position.set(0.1, 0.8, 0.65);
      cavityMesh.scale.set(1.1, 0.8, 0.7);
      toothGroup.add(cavityMesh);

      // ----------------------------------------------------
      // 4. PULP & NERVE CANALS
      // ----------------------------------------------------
      const nerveGroup = new THREE.Group();
      const nerveMat = new THREE.MeshStandardMaterial({
        color: 0xff0033,
        roughness: 0.2,
        emissive: 0xff0022,
        emissiveIntensity: 0.85
      });

      // Pulp Chamber
      const pulpGeo = new THREE.SphereGeometry(0.32, 16, 16);
      const pulpMesh = new THREE.Mesh(pulpGeo, nerveMat);
      pulpMesh.position.set(0, -0.2, 0);
      nerveGroup.add(pulpMesh);

      // Root Canals
      for (let side of [-0.55, 0.55]) {
        const canalGeo = new THREE.CylinderGeometry(0.08, 0.03, 1.8, 16);
        const canal = new THREE.Mesh(canalGeo, nerveMat);
        canal.position.set(side, -1.1, 0);
        canal.rotation.z = side * -0.1;
        nerveGroup.add(canal);
      }
      nerveMesh = nerveGroup;
      toothGroup.add(nerveGroup);

      toothGroup.position.set(0, -0.1, 0);
      scene.add(toothGroup);

      // ----------------------------------------------------
      // 5. HIGH-PRECISION DENTAL HIGH-SPEED HANDPIECE & DRILL
      // ----------------------------------------------------
      drillGroup = new THREE.Group();

      // Metallic Contra-Angle Handpiece
      const handpieceGeo = new THREE.CylinderGeometry(0.18, 0.22, 3.8, 32);
      const metalMat = new THREE.MeshStandardMaterial({
        color: 0xe0e5ec,
        metalness: 0.95,
        roughness: 0.12
      });
      const handpiece = new THREE.Mesh(handpieceGeo, metalMat);
      handpiece.rotation.z = Math.PI / 4;
      drillGroup.add(handpiece);

      // Diamond Burr Tip
      const burrGeo = new THREE.ConeGeometry(0.08, 0.75, 24);
      const burrMat = new THREE.MeshStandardMaterial({
        color: 0xffd700,
        metalness: 0.9,
        roughness: 0.2
      });
      const burr = new THREE.Mesh(burrGeo, burrMat);
      burr.position.set(-1.42, -1.42, 0);
      burr.rotation.z = Math.PI / 4 + Math.PI;
      drillGroup.add(burr);

      drillGroup.position.set(3, 3, 2);
      scene.add(drillGroup);

      // Sparks / Friction Particles
      const particleCount = 180;
      const particleGeo = new THREE.BufferGeometry();
      const posArray = new Float32Array(particleCount * 3);
      for(let i=0; i<particleCount*3; i++) {
        posArray[i] = (Math.random() - 0.5) * 0.5;
      }
      particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      const particleMat = new THREE.PointsMaterial({
        size: 0.08,
        color: 0xffaa00,
        transparent: true,
        opacity: 0
      });
      pulseParticleSystem = new THREE.Points(particleGeo, particleMat);
      pulseParticleSystem.position.set(0.1, 0.8, 0.65);
      scene.add(pulseParticleSystem);
    }

    window.loadSceneConfig = function(config) {
      sceneConfig = config;
    };

    window.renderFrameAtTime = function(timeInSeconds, totalDuration) {
      if (!isReady) return;

      const progress = timeInSeconds / totalDuration;

      // Dynamic Camera Motion
      if (progress < 0.35) {
        const p = progress / 0.35;
        camera.position.x = Math.sin(p * Math.PI) * 0.8;
        camera.position.y = 1.2 - p * 0.4;
        camera.position.z = 7.5 - p * 3.8;
        camera.lookAt(0, 0.2, 0);
      } else if (progress < 0.70) {
        const p = (progress - 0.35) / 0.35;
        camera.position.x = 0.4 * Math.cos(p * Math.PI * 2);
        camera.position.y = 0.8 + p * 0.3;
        camera.position.z = 3.7 - p * 1.2;
        camera.lookAt(0.1, 0.8, 0.65);
      } else {
        const p = (progress - 0.70) / 0.30;
        camera.position.x = 0;
        camera.position.y = 1.0 + p * 0.6;
        camera.position.z = 2.5 + p * 4.5;
        camera.lookAt(0, 0, 0);
      }

      // Drill Motion & Decay Removal Animation
      if (progress > 0.20 && progress < 0.80) {
        const drillProgress = Math.min(1, (progress - 0.20) / 0.15);
        const drillX = 3.0 * (1 - drillProgress) + 0.22 * drillProgress;
        const drillY = 3.0 * (1 - drillProgress) + 0.92 * drillProgress;
        const drillZ = 2.0 * (1 - drillProgress) + 0.80 * drillProgress;
        drillGroup.position.set(drillX, drillY, drillZ);

        drillGroup.position.x += (Math.random() - 0.5) * 0.04;
        drillGroup.position.y += (Math.random() - 0.5) * 0.04;

        pulseParticleSystem.material.opacity = 0.95;
        const positions = pulseParticleSystem.geometry.attributes.position.array;
        for (let i = 0; i < positions.length; i += 3) {
          positions[i] += (Math.random() - 0.5) * 0.06;
          positions[i+1] += Math.random() * 0.05;
          positions[i+2] += (Math.random() - 0.5) * 0.06;
        }
        pulseParticleSystem.geometry.attributes.position.needsUpdate = true;

        const cleanProgress = Math.min(1, Math.max(0, (progress - 0.35) / 0.35));
        cavityMesh.scale.set(1.1 * (1 - cleanProgress * 0.88), 0.8 * (1 - cleanProgress * 0.92), 0.7 * (1 - cleanProgress * 0.85));
      } else {
        drillGroup.position.set(5, 5, 5);
        pulseParticleSystem.material.opacity = 0;
      }

      if (nerveMesh) {
        nerveMesh.children.forEach(child => {
          if (child.material && child.material.emissiveIntensity !== undefined) {
            child.material.emissiveIntensity = 0.6 + Math.sin(timeInSeconds * 12) * 0.35;
          }
        });
      }

      toothGroup.rotation.y = Math.sin(timeInSeconds * 1.2) * 0.22;

      updateCaptionOverlay(timeInSeconds);

      renderer.render(scene, camera);
    };

    function updateCaptionOverlay(currentTime) {
      const captionTextEl = document.getElementById('caption-text');
      if (!sceneConfig || !sceneConfig.subtitles) return;

      const sub = sceneConfig.subtitles.find(s => currentTime >= s.start && currentTime <= s.end);
      if (sub) {
        const words = sub.text.split(' ');
        const html = words.map((w, idx) => {
          const cleanW = w.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
          if (['tooth', 'cavity', 'drill', 'nerve', 'pain', 'decay', 'clean', 'cusps', 'molar'].includes(cleanW)) {
            return `<span class="word-accent">${w}</span>`;
          } else if (idx % 3 === 1) {
            return `<span class="word-highlight">${w}</span>`;
          }
          return w;
        }).join(' ');

        captionTextEl.innerHTML = html;
        captionTextEl.classList.add('active');
      } else {
        captionTextEl.classList.remove('active');
      }
    }

    window.addEventListener('load', initEngine);
  </script>
</body>
</html>
