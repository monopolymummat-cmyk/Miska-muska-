<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zack Studio 3D Renderer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 1080px; height: 1920px; overflow: hidden; background: #080a10; font-family: 'Impact', 'Arial Black', sans-serif; }
    #canvas-container { width: 1080px; height: 1920px; position: absolute; top: 0; left: 0; z-index: 1; }

    /* Dynamic Overlay Captions Studio */
    #caption-overlay {
      position: absolute;
      top: 0; left: 0; width: 1080px; height: 1920px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 60px;
      text-align: center;
    }

    .caption-box {
      position: absolute;
      bottom: 480px;
      width: 90%;
      text-align: center;
      line-height: 1.15;
      text-transform: uppercase;
      font-size: 78px;
      letter-spacing: 2px;
      color: #FFFFFF;
      text-shadow:
        0px 0px 20px rgba(0,0,0,0.9),
        4px 4px 0px #000,
        -4px -4px 0px #000,
        4px -4px 0px #000,
        -4px 4px 0px #000;
      opacity: 0;
      transform: scale(0.85);
      transition: all 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .caption-box.active {
      opacity: 1;
      transform: scale(1.05);
    }

    .word-highlight {
      color: #FFEA00;
      display: inline-block;
      text-shadow:
        0px 0px 25px rgba(255, 234, 0, 0.8),
        4px 4px 0px #000,
        -4px -4px 0px #000;
    }

    .word-accent {
      color: #FF2A55;
      display: inline-block;
      text-shadow:
        0px 0px 25px rgba(255, 42, 85, 0.8),
        4px 4px 0px #000,
        -4px -4px 0px #000;
    }

    /* Cinematic Vignette */
    #vignette {
      position: absolute;
      top: 0; left: 0; width: 1080px; height: 1920px;
      z-index: 5;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.7) 85%, rgba(0, 0, 0, 0.98) 100%);
    }
  </style>
  <!-- Load Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="vignette"></div>
  <div id="caption-overlay">
    <div id="caption-text" class="caption-box"></div>
  </div>

  <script>
    // Zack D. Films Renderer Engine
    let scene, camera, renderer;
    let toothGroup, drillGroup, cavityMesh, nerveMesh, pulseParticleSystem;
    let sceneConfig = null;
    let isReady = false;

    function initEngine() {
      const container = document.getElementById('canvas-container');

      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0c14);
      scene.fog = new THREE.FogExp2(0x0a0c14, 0.035);

      // Camera (9:16 vertical view)
      camera = new THREE.PerspectiveCamera(45, 1080 / 1920, 0.1, 100);
      camera.position.set(0, 1.2, 7.5);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
      renderer.setSize(1080, 1920);
      renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.35;
      container.appendChild(renderer.domElement);

      // Studio Lighting System (Zack D. Films Signature Dynamic Rim Lighting)
      const ambientLight = new THREE.AmbientLight(0x1a2035, 1.8);
      scene.add(ambientLight);

      // Key Rim Light Top-Right (Dramatic Cyan rim)
      const rimLight1 = new THREE.DirectionalLight(0x00d2ff, 4.5);
      rimLight1.position.set(6, 8, -4);
      scene.add(rimLight1);

      // Key Accent Light Top-Left (Hot Pink rim)
      const rimLight2 = new THREE.DirectionalLight(0xff2a55, 3.8);
      rimLight2.position.set(-6, 6, 4);
      scene.add(rimLight2);

      // Front Main Spotlight
      const mainSpot = new THREE.SpotLight(0xffffff, 5.0, 20, Math.PI / 4, 0.5, 1);
      mainSpot.position.set(0, 5, 8);
      mainSpot.castShadow = true;
      mainSpot.shadow.mapSize.width = 2048;
      mainSpot.shadow.mapSize.height = 2048;
      mainSpot.shadow.bias = -0.0001;
      scene.add(mainSpot);

      // Bottom Fill Light
      const bottomFill = new THREE.PointLight(0x3366ff, 1.5, 10);
      bottomFill.position.set(0, -4, 3);
      scene.add(bottomFill);

      // Studio Floor Platform
      const floorGeo = new THREE.PlaneGeometry(30, 30);
      const floorMat = new THREE.MeshStandardMaterial({
        color: 0x0f111c,
        roughness: 0.35,
        metalness: 0.85
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -2.5;
      floor.receiveShadow = true;
      scene.add(floor);

      build3DSubject();
      isReady = true;
    }

    function build3DSubject() {
      toothGroup = new THREE.Group();

      // Enamel / Crown Geometry
      const crownGeo = new THREE.CylinderGeometry(1.2, 1.0, 1.8, 32, 16);
      const posAttr = crownGeo.attributes.position;
      for (let i = 0; i < posAttr.count; i++) {
        let x = posAttr.getX(i);
        let y = posAttr.getY(i);
        let z = posAttr.getZ(i);
        let bump = Math.sin(x * 3) * 0.08 + Math.cos(z * 3) * 0.08;
        if (y > 0.5) bump += Math.sin(x * 5 + z * 5) * 0.15;
        posAttr.setXYZ(i, x + bump * 0.1, y, z + bump * 0.1);
      }
      crownGeo.computeVertexNormals();

      const crownMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.12,
        metalness: 0.08,
        clearcoat: 0.9,
        clearcoatRoughness: 0.1
      });
      const crown = new THREE.Mesh(crownGeo, crownMat);
      crown.castShadow = true;
      crown.receiveShadow = true;
      toothGroup.add(crown);

      // Roots
      const rootMat = new THREE.MeshStandardMaterial({
        color: 0xe8e0d5,
        roughness: 0.35,
        metalness: 0.0
      });

      for (let side = -1; side <= 1; side += 2) {
        const rootGeo = new THREE.ConeGeometry(0.45, 2.0, 24);
        const root = new THREE.Mesh(rootGeo, rootMat);
        root.position.set(side * 0.5, -1.8, 0);
        root.rotation.z = side * -0.15;
        root.castShadow = true;
        toothGroup.add(root);
      }

      // Internal Cavity
      const cavityGeo = new THREE.SphereGeometry(0.42, 24, 24);
      const cavityMat = new THREE.MeshStandardMaterial({
        color: 0x1a0d05,
        roughness: 0.9,
        metalness: 0.1,
        emissive: 0x440000,
        emissiveIntensity: 0.5
      });
      cavityMesh = new THREE.Mesh(cavityGeo, cavityMat);
      cavityMesh.position.set(0, 0.4, 0.85);
      cavityMesh.scale.set(1, 1.2, 0.5);
      toothGroup.add(cavityMesh);

      // Internal Nerve
      const nerveGeo = new THREE.CylinderGeometry(0.12, 0.08, 2.8, 16);
      const nerveMat = new THREE.MeshStandardMaterial({
        color: 0xff0033,
        roughness: 0.25,
        emissive: 0xff0033,
        emissiveIntensity: 0.8
      });
      nerveMesh = new THREE.Mesh(nerveGeo, nerveMat);
      nerveMesh.position.set(0, -0.6, 0);
      toothGroup.add(nerveMesh);

      toothGroup.position.set(0, 0, 0);
      scene.add(toothGroup);

      // Dental Drill
      drillGroup = new THREE.Group();

      const handleGeo = new THREE.CylinderGeometry(0.15, 0.18, 3.5, 24);
      const metalMat = new THREE.MeshStandardMaterial({
        color: 0xeeeeee,
        metalness: 0.95,
        roughness: 0.08
      });
      const handle = new THREE.Mesh(handleGeo, metalMat);
      handle.rotation.z = Math.PI / 4;
      drillGroup.add(handle);

      const tipGeo = new THREE.ConeGeometry(0.06, 0.8, 16);
      const tipMat = new THREE.MeshStandardMaterial({
        color: 0xffea00,
        metalness: 0.9,
        roughness: 0.15
      });
      const tip = new THREE.Mesh(tipGeo, tipMat);
      tip.position.set(-1.3, -1.3, 0);
      tip.rotation.z = Math.PI / 4 + Math.PI;
      drillGroup.add(tip);

      drillGroup.position.set(3, 3, 2);
      scene.add(drillGroup);

      // Sparks
      const particleCount = 150;
      const particleGeo = new THREE.BufferGeometry();
      const posArray = new Float32Array(particleCount * 3);
      for(let i=0; i<particleCount*3; i++) {
        posArray[i] = (Math.random() - 0.5) * 0.5;
      }
      particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      const particleMat = new THREE.PointsMaterial({
        size: 0.07,
        color: 0xffcc00,
        transparent: true,
        opacity: 0
      });
      pulseParticleSystem = new THREE.Points(particleGeo, particleMat);
      pulseParticleSystem.position.set(0, 0.4, 0.85);
      scene.add(pulseParticleSystem);
    }

    window.loadSceneConfig = function(config) {
      sceneConfig = config;
    };

    window.renderFrameAtTime = function(timeInSeconds, totalDuration) {
      if (!isReady) return;

      const progress = timeInSeconds / totalDuration;

      // Dynamic Camera Motion
      if (progress < 0.35) {
        const p = progress / 0.35;
        camera.position.x = Math.sin(p * Math.PI) * 0.8;
        camera.position.y = 1.2 - p * 0.4;
        camera.position.z = 7.5 - p * 3.8;
        camera.lookAt(0, 0.2, 0);
      } else if (progress < 0.70) {
        const p = (progress - 0.35) / 0.35;
        camera.position.x = 0.4 * Math.cos(p * Math.PI * 2);
        camera.position.y = 0.8 + p * 0.3;
        camera.position.z = 3.7 - p * 1.2;
        camera.lookAt(0, 0.4, 0.85);
      } else {
        const p = (progress - 0.70) / 0.30;
        camera.position.x = 0;
        camera.position.y = 1.0 + p * 0.6;
        camera.position.z = 2.5 + p * 4.5;
        camera.lookAt(0, 0, 0);
      }

      // Drill Motion
      if (progress > 0.20 && progress < 0.80) {
        const drillProgress = Math.min(1, (progress - 0.20) / 0.15);
        const drillX = 3.0 * (1 - drillProgress) + 0.15 * drillProgress;
        const drillY = 3.0 * (1 - drillProgress) + 0.5 * drillProgress;
        const drillZ = 2.0 * (1 - drillProgress) + 1.0 * drillProgress;
        drillGroup.position.set(drillX, drillY, drillZ);

        drillGroup.position.x += (Math.random() - 0.5) * 0.05;
        drillGroup.position.y += (Math.random() - 0.5) * 0.05;

        pulseParticleSystem.material.opacity = 0.95;
        const positions = pulseParticleSystem.geometry.attributes.position.array;
        for (let i = 0; i < positions.length; i += 3) {
          positions[i] += (Math.random() - 0.5) * 0.06;
          positions[i+1] += Math.random() * 0.05;
          positions[i+2] += (Math.random() - 0.5) * 0.06;
        }
        pulseParticleSystem.geometry.attributes.position.needsUpdate = true;

        const cleanProgress = Math.min(1, Math.max(0, (progress - 0.35) / 0.35));
        cavityMesh.scale.set(1 - cleanProgress * 0.85, 1.2 - cleanProgress * 0.95, 0.5 - cleanProgress * 0.45);
      } else {
        drillGroup.position.set(5, 5, 5);
        pulseParticleSystem.material.opacity = 0;
      }

      if (nerveMesh) {
        nerveMesh.material.emissiveIntensity = 0.5 + Math.sin(timeInSeconds * 10) * 0.4;
      }

      toothGroup.rotation.y = Math.sin(timeInSeconds * 1.2) * 0.25;

      updateCaptionOverlay(timeInSeconds);

      renderer.render(scene, camera);
    };

    function updateCaptionOverlay(currentTime) {
      const captionTextEl = document.getElementById('caption-text');
      if (!sceneConfig || !sceneConfig.subtitles) return;

      const sub = sceneConfig.subtitles.find(s => currentTime >= s.start && currentTime <= s.end);
      if (sub) {
        const words = sub.text.split(' ');
        const html = words.map((w, idx) => {
          const cleanW = w.replace(/[^a-zA-Z0-0]/g, '').toLowerCase();
          if (['tooth', 'cavity', 'drill', 'nerve', 'pain', 'decay', 'clean'].includes(cleanW)) {
            return `<span class="word-accent">${w}</span>`;
          } else if (idx % 3 === 1) {
            return `<span class="word-highlight">${w}</span>`;
          }
          return w;
        }).join(' ');

        captionTextEl.innerHTML = html;
        captionTextEl.classList.add('active');
      } else {
        captionTextEl.classList.remove('active');
      }
    }

    window.addEventListener('load', initEngine);
  </script>
</body>
</html>
